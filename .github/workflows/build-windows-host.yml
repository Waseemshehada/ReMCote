name: Windows Build

on:
  push:
    branches: [main]
    paths:
      - "windows-host/**"
      - ".github/workflows/build-windows-host.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  NV_HEADERS_TAG: n12.2.72.0

jobs:
  build:
    name: Build ReMCote Host (Windows)
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
        working-directory: windows-host

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Conan 2
        run: |
          pip install "conan>=2.4,<3"
          conan --version

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2/p
          key: conan2-windows2022-${{ hashFiles('windows-host/conanfile.txt') }}
          restore-keys: conan2-windows2022-

      - name: Conan profile (MSVC 2022, x64, Release)
        run: |
          conan profile detect --force
          conan profile show

      - name: Resolve prebuilt dependencies (Conan install)
        run: |
          conan install . `
            --output-folder=conan `
            --build=never `
            -s build_type=Release `
            -s arch=x86_64 `
            -s compiler.cppstd=17
          if ($LASTEXITCODE -ne 0) { throw "conan install failed" }
          $toolchain = "conan\build\Release\generators\conan_toolchain.cmake"
          if (-not (Test-Path $toolchain)) {
            Write-Host "Conan output tree:"
            if (Test-Path "conan") {
              Get-ChildItem -Path conan -Recurse | Select-Object FullName
            } else {
              Write-Host "The conan output directory does not exist."
            }
            throw "$toolchain not found after install"
          }
          Write-Host "Conan toolchain: $((Resolve-Path $toolchain).Path)"

      - name: Print resolved package IDs
        run: conan graph info . -s build_type=Release -s arch=x86_64 -s compiler.cppstd=17 --format=text 2>$null | Select-String -Pattern "ref:|package_id:|binary:" | Select-Object -First 60

      - name: Fetch NVENC headers (pinned)
        run: |
          git clone --depth 1 --branch $env:NV_HEADERS_TAG https://github.com/FFmpeg/nv-codec-headers third_party/nv-codec-headers
          if ($LASTEXITCODE -ne 0) { throw "nv-codec-headers clone failed" }

      - name: CMake configure
        run: |
          $toolchain = (Resolve-Path "conan\build\Release\generators\conan_toolchain.cmake").Path
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DCMAKE_BUILD_TYPE=Release
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Compile ReMCoteHost
        run: |
          cmake --build build --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Compile failed" }

      - name: Verify ReMCoteHost.exe
        run: |
          $exe = "build\bin\Release\ReMCoteHost.exe"
          if (-not (Test-Path $exe)) { throw "ReMCoteHost.exe not found at $exe" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $exe dist\ReMCoteHost.exe -Force
          Get-Item dist\ReMCoteHost.exe | Format-List Name, Length

      - name: CI self-test (no GPU required)
        run: |
          $p = Start-Process -FilePath "dist\ReMCoteHost.exe" -ArgumentList "--ci-self-test" -PassThru -Wait -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "CI self-test failed with exit code $($p.ExitCode)" }
          Write-Host "CI self-test passed"

      - name: Download VC++ redistributable
        run: |
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile installer\vc_redist.x64.exe
          Get-Item installer\vc_redist.x64.exe | Format-List Name, Length

      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\ReMCoteSetup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed" }
          if (-not (Test-Path installer\output\ReMCoteSetup.exe)) { throw "ReMCoteSetup.exe not produced" }

      - name: Package developer ZIP
        run: |
          Copy-Item README.txt dist\README.txt -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\* -DestinationPath ReMCoteHost-Windows.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ReMCote-Windows
          path: |
            windows-host/installer/output/ReMCoteSetup.exe
            windows-host/ReMCoteHost-Windows.zip

      - name: Publish GitHub Release (tag latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "ReMCote for Windows — Latest"
          body: |
            Download **ReMCoteSetup.exe**, run it, and ReMCote opens with your Device ID.
            Connect from another computer at https://remcote.replit.app
          files: |
            windows-host/installer/output/ReMCoteSetup.exe
            windows-host/ReMCoteHost-Windows.zip
          make_latest: true
